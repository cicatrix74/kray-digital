  <text x="255" y="180" fill="#f1f5f9" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Ст3пс / 09Г2С</text>

  <rect x="375" y="148" width="115" height="42" rx="6" fill="#0a0f1d" stroke="#253554" />
  <text x="385" y="163" fill="#64748b" font-family="system-ui, sans-serif" font-size="8">СЕЧЕНИЕ (ММ)</text>
  <text x="385" y="180" fill="#f1f5f9" font-family="system-ui, sans-serif" font-weight="600" font-size="11">80 x 80 x 4.0</text>

  <rect x="500" y="148" width="115" height="42" rx="6" fill="#0a0f1d" stroke="#253554" />
