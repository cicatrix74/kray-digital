  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-grad-1)" />
  <circle cx="700" cy="80" r="180" fill="#00f2fe" fill-opacity="0.05" filter="blur(40px)" />
  <circle cx="100" cy="350" r="140" fill="#4facfe" fill-opacity="0.04" filter="blur(30px)" />

  <!-- Grid overlay -->
  <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="#1e293b" stroke-opacity="0.25" stroke-dasharray="4 4" />
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#1e293b" stroke-opacity="0.25" stroke-dasharray="4 4" />

  <!-- Top App Navigation Bar -->
  <rect x="30" y="25" width="740" height="48" rx="8" fill="#111a2e" stroke="#1e293b" stroke-width="1" />
