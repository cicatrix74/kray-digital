  <text x="52" y="178" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Арматура А500С</text>
  
  <rect x="42" y="195" width="156" height="28" rx="6" fill="#0d1527" />
  <text x="52" y="213" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Балка двутавровая</text>

