  <text x="260" y="230" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Оптовая стоимость с НДС (Скидка за объем 8%):</text>
  <text x="260" y="262" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="22">438 200 ₴</text>
  <text x="405" y="260" fill="#10b981" font-family="system-ui, sans-serif" font-weight="600" font-size="11">✓ Доставка краном включена</text>

  <rect x="610" y="224" width="130" height="42" rx="6" fill="url(#cyan-glow)" />
  <text x="628" y="250" fill="#050811" font-family="system-ui, sans-serif" font-weight="800" font-size="11">В СПЕЦИФИКАЦИЮ →</text>

  <!-- Bottom Data Table / Quick Stats -->
  <rect x="225" y="315" width="545" height="110" rx="10" fill="url(#panel-grad)" stroke="#1e293b" stroke-width="1" />
  <text x="245" y="338" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" letter-spacing="0.5">ПОСЛЕДНИЕ ОТГРУЗКИ В РЕАЛЬНОМ ВРЕМЕНИ (СИНХРОНИЗАЦИЯ 1C)</text>

  <g transform="translate(245, 350)">
    <rect width="165" height="60" rx="6" fill="#09101d" stroke="#1a2538" />
    <text x="12" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Заказ №8492 • Днепр</text>
    <text x="12" y="44" fill="#f1f5f9" font-family="system-ui, sans-serif" font-weight="700" font-size="12">14.8 т • Арматура</text>
  </g>

  <g transform="translate(418, 350)">
    <rect width="170" height="60" rx="6" fill="#09101d" stroke="#1a2538" />
    <text x="12" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Заказ №8493 • Киев</text>
    <text x="12" y="44" fill="#f1f5f9" font-family="system-ui, sans-serif" font-weight="700" font-size="12">8.2 т • Двутавр 20Б1</text>
  </g>

  <g transform="translate(595, 350)">
    <rect width="160" height="60" rx="6" fill="#09101d" stroke="#00f2fe" stroke-opacity="0.3" />
    <text x="12" y="22" fill="#00f2fe" font-family="system-ui, sans-serif" font-weight="600" font-size="9">СКОРОСТЬ ВЫГРУЗКИ</text>
    <text x="12" y="44" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="13">0.8s Next.js</text>
  </g>
