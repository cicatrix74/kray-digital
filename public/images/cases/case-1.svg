  <rect x="180" y="37" width="220" height="24" rx="6" fill="#0a0f1d" stroke="#253554" />
  <text x="195" y="53" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Поиск ГОСТ, марка стали, профиль...</text>
  
  <rect x="580" y="36" width="80" height="26" rx="6" fill="#1e293b" />
