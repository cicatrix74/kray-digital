  <rect x="625" y="148" width="130" height="42" rx="6" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.5" />
  <text x="635" y="163" fill="#00f2fe" font-family="system-ui, sans-serif" font-size="8">ИТОГОВЫЙ ВЕС</text>
  <text x="635" y="181" fill="#00f2fe" font-family="system-ui, sans-serif" font-weight="800" font-size="13">11.45 тонн</text>

  <!-- Result Banner inside Calculator -->
