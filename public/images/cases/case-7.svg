<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg-grad-7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121f" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>
    <linearGradient id="cyan-glow-7" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="panel-grad-7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c2e" />
      <stop offset="100%" stop-color="#09101d" />
