  <text x="58" y="241" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="20">&lt; 15 мин</text>
  <text x="145" y="240" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Круглосуточно 24/7</text>

  <!-- Metric 3 -->
