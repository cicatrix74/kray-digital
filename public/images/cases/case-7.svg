  <!-- Server nodes grid -->
  <g transform="translate(305, 148)">
    <!-- Node 1 -->
    <rect width="445" height="48" rx="6" fill="#080e1a" stroke="#1a273c" />
    <circle cx="25" cy="24" r="5" fill="#10b981" />
    <text x="42" y="22" fill="#f1f5f9" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Production Web-Cluster (Nginx + PHP-FPM 8.2)</text>
    <text x="42" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Ответ сервера: 18ms • SSL сертификат: Действителен (A+)</text>
    <text x="385" y="28" fill="#10b981" font-family="system-ui, sans-serif" font-weight="700" font-size="11">ONLINE</text>

    <!-- Node 2 -->
    <g transform="translate(0, 58)">
      <rect width="445" height="48" rx="6" fill="#080e1a" stroke="#1a273c" />
      <circle cx="25" cy="24" r="5" fill="#10b981" />
      <text x="42" y="22" fill="#f1f5f9" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Database Primary Cluster (PostgreSQL + Read-Replicas)</text>
      <text x="42" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Запросы в сек: 1 420 QPS • Нагрузка: В норме (14%)</text>
      <text x="385" y="28" fill="#10b981" font-family="system-ui, sans-serif" font-weight="700" font-size="11">ONLINE</text>
    </g>

    <!-- Node 3 -->
    <g transform="translate(0, 116)">
      <rect width="445" height="48" rx="6" fill="#080e1a" stroke="#1a273c" />
      <circle cx="25" cy="24" r="5" fill="#10b981" />
      <text x="42" y="22" fill="#f1f5f9" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Daily Cloud Backup Service (S3 Glacier Sync)</text>
      <text x="42" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Последний снимок: Сегодня в 03:00 (Размер: 42.6 GB)</text>
      <text x="380" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="700" font-size="11">SYNCED</text>
    </g>

    <!-- Node 4 -->
    <g transform="translate(0, 174)">
      <rect width="445" height="48" rx="6" fill="#080e1a" stroke="#1a273c" />
      <circle cx="25" cy="24" r="5" fill="#10b981" />
      <text x="42" y="22" fill="#f1f5f9" font-family="system-ui, sans-serif" font-weight="600" font-size="11">Cloudflare Enterprise WAF &amp; DDoS Shield</text>
      <text x="42" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Отражено атак за 30 дней: 14 200 • Ложных блокировок: 0</text>
      <text x="375" y="28" fill="#10b981" font-family="system-ui, sans-serif" font-weight="700" font-size="11">SECURED</text>
    </g>
