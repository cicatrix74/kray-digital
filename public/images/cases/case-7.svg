  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-7)" />
  <circle cx="700" cy="80" r="160" fill="#00f2fe" fill-opacity="0.06" filter="blur(40px)" />
  <circle cx="100" cy="370" r="140" fill="#38bdf8" fill-opacity="0.05" filter="blur(30px)" />

  <!-- Navigation -->
  <rect x="30" y="25" width="740" height="48" rx="8" fill="#0f192b" stroke="#1d2d46" stroke-width="1" />
  <text x="50" y="54" fill="#00f2fe" font-family="system-ui, sans-serif" font-weight="800" font-size="14" letter-spacing="1">INFRASTRUCTURE SLA 24/7</text>
  <rect x="250" y="37" width="230" height="24" rx="6" fill="#070c16" stroke="#1d2d46" />
  <text x="265" y="53" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Мониторинг серверов, бэкапов и баз данных</text>
  
