  <text x="58" y="311" fill="#34d399" font-family="system-ui, sans-serif" font-weight="900" font-size="20">Daily Cloud</text>

  <rect x="45" y="338" width="210" height="72" rx="8" fill="#060b14" stroke="#00f2fe" stroke-opacity="0.2" />
  <text x="58" y="358" fill="#00f2fe" font-family="system-ui, sans-serif" font-weight="700" font-size="10">СЕРВЕРНАЯ ТЕЛЕМЕТРИЯ</text>
