  <rect x="665" y="36" width="95" height="26" rx="6" fill="url(#cyan-glow-7)" />
  <text x="677" y="53" fill="#040810" font-family="system-ui, sans-serif" font-weight="700" font-size="10">Uptime: 99.99%</text>

  <!-- Left: SLA Status Cards -->
