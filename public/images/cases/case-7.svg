  <text x="58" y="171" fill="#00f2fe" font-family="system-ui, sans-serif" font-weight="900" font-size="20">99.99%</text>
  <text x="145" y="170" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">365 дней без сбоев</text>

  <!-- Metric 2 -->
  <rect x="45" y="195" width="210" height="60" rx="8" fill="#080e1a" stroke="#1d2d46" />
