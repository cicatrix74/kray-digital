  <text x="45" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" letter-spacing="0.5">SLA ПОКАЗАТЕЛИ ПОДДЕРЖКИ</text>

  <!-- Metric 1 -->
  <rect x="45" y="125" width="210" height="60" rx="8" fill="#080e1a" stroke="#00f2fe" stroke-opacity="0.3" />
