<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <linearGradient id="bg-grad-5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c121e" />
      <stop offset="100%" stop-color="#060910" />
    </linearGradient>
    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="panel-grad-5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2c" />
      <stop offset="100%" stop-color="#0c121d" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-5)" />
  <circle cx="690" cy="80" r="160" fill="#10b981" fill-opacity="0.06" filter="blur(40px)" />
  <circle cx="110" cy="370" r="140" fill="#f59e0b" fill-opacity="0.05" filter="blur(30px)" />

  <!-- Navigation -->
  <rect x="30" y="25" width="740" height="48" rx="8" fill="#111928" stroke="#1f2a3c" stroke-width="1" />
  <text x="50" y="54" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="800" font-size="14" letter-spacing="1">AUTOPARTS-DIRECT</text>
  <rect x="220" y="37" width="230" height="24" rx="6" fill="#090d15" stroke="#1f2a3c" />
  <text x="235" y="53" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Поиск запчасти по VIN-коду или артикулу...</text>
  
  <rect x="560" y="36" width="95" height="26" rx="6" fill="#1e293b" />
  <text x="572" y="53" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Склад: 85k SKU</text>
  <rect x="665" y="36" width="95" height="26" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" />
  <text x="677" y="53" fill="#34d399" font-family="system-ui, sans-serif" font-weight="700" font-size="10">PageSpeed: 92/100</text>

  <!-- Left: Speed Comparison (Before vs After) -->
  <rect x="30" y="85" width="240" height="340" rx="10" fill="url(#panel-grad-5)" stroke="#1f2a3c" stroke-width="1" />
  <text x="45" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="10" letter-spacing="0.5">ОПТИМИЗАЦИЯ СКОРОСТИ</text>

  <!-- Before Box -->
  <rect x="45" y="125" width="210" height="65" rx="8" fill="#090e17" stroke="#ef4444" stroke-opacity="0.3" />
  <text x="58" y="145" fill="#ef4444" font-family="system-ui, sans-serif" font-weight="700" font-size="9">ДО ОПТИМИЗАЦИИ (СТАРЫЙ ДВИЖОК)</text>
  <text x="58" y="172" fill="#f87171" font-family="system-ui, sans-serif" font-weight="900" font-size="20">6.4s</text>
  <text x="110" y="171" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">PageSpeed 24/100 (Красная зона)</text>

  <!-- After Box -->
  <rect x="45" y="200" width="210" height="70" rx="8" fill="#090e17" stroke="#10b981" stroke-opacity="0.4" />
  <text x="58" y="220" fill="#10b981" font-family="system-ui, sans-serif" font-weight="700" font-size="9">ПОСЛЕ РЕФАКТОРИНГА KRAY DIGITAL</text>
  <text x="58" y="248" fill="#34d399" font-family="system-ui, sans-serif" font-weight="900" font-size="22">1.2s</text>
  <text x="110" y="246" fill="#10b981" font-family="system-ui, sans-serif" font-weight="700" font-size="11">PageSpeed 92/100 ★</text>

  <!-- Metrics row -->
  <rect x="45" y="280" width="210" height="55" rx="8" fill="#090e17" stroke="#1f2a3c" />
  <text x="58" y="300" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">СНИЖЕНИЕ ОТКАЗОВ В КОРЗИНЕ</text>
  <text x="58" y="324" fill="#38bdf8" font-family="system-ui, sans-serif" font-weight="900" font-size="18">-40% Drop-off</text>

  <rect x="45" y="345" width="210" height="65" rx="8" fill="#070c14" stroke="#10b981" stroke-opacity="0.2" />
  <text x="58" y="365" fill="#10b981" font-family="system-ui, sans-serif" font-weight="700" font-size="10">CORE WEB VITALS AUDIT</text>
  <text x="58" y="382" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">LCP: 0.9s • FID: 12ms • CLS: 0.01</text>
  <text x="58" y="398" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="9">✓ Все тесты Google пройдены</text>

  <!-- Right: PageSpeed Dashboard & Code Architecture Preview -->
  <rect x="285" y="85" width="485" height="340" rx="10" fill="url(#panel-grad-5)" stroke="#1f2a3c" stroke-width="1" />
  <text x="305" y="115" fill="#f8fafc" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Google PageSpeed Insights &amp; Архитектура кэширования</text>
  <text x="305" y="132" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Устранение блокирующих рендеринг скриптов и сжатие каталога из 85 000 товаров</text>

  <!-- Speed Score Ring Widget -->
  <g transform="translate(315, 150)">
    <circle cx="55" cy="55" r="45" stroke="#1e293b" stroke-width="8" fill="none" />
    <circle cx="55" cy="55" r="45" stroke="#10b981" stroke-width="8" stroke-dasharray="283" stroke-dashoffset="23" stroke-linecap="round" fill="none" />
    <text x="37" y="62" fill="#34d399" font-family="system-ui, sans-serif" font-weight="900" font-size="26">92</text>
    
    <text x="125" y="42" fill="#f1f5f9" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Производительность Mobile</text>
    <text x="125" y="62" fill="#10b981" font-family="system-ui, sans-serif" font-weight="600" font-size="12">✓ Соответствует критериям Core Web Vitals</text>
    <text x="125" y="80" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">First Contentful Paint (FCP): 0.7 с (Быстро)</text>
  </g>

  <!-- Code / Optimization Pipeline steps -->
  <g transform="translate(305, 275)">
    <rect width="445" height="135" rx="8" fill="#080c14" stroke="#182334" />
    <text x="15" y="22" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">ПРИМЕНЕННЫЕ ОПТИМИЗАЦИИ</text>

    <!-- Step 1 -->
    <rect x="15" y="32" width="415" height="26" rx="4" fill="#0d1522" />
    <text x="25" y="49" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">✓ Redis / FastCGI кэширование каталога и остатков на сервере</text>

    <!-- Step 2 -->
    <rect x="15" y="64" width="415" height="26" rx="4" fill="#0d1522" />
    <text x="25" y="81" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">✓ Удаление 4 тяжелых jQuery плагинов и переход на чистый Vanilla JS</text>

    <!-- Step 3 -->
    <rect x="15" y="96" width="415" height="26" rx="4" fill="#0d1522" />
    <text x="25" y="113" fill="#34d399" font-family="system-ui, sans-serif" font-weight="600" font-size="10">✓ Конвертация 120 000 фото товаров в WebP / AVIF (экономия 78% трафика)</text>
  </g>
</svg>