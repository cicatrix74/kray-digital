<!doctype html>
<html lang="uk" class="dark">
  <head>
    <meta charset="UTF-8" />

    <meta name="description" content="Digital-агентство Kray Digital. Розробка швидких веб-сайтів від 5 000 ₴, SEO-оптимізація та Google реклама. Символічна передоплата 10% — 90% за фактом робіт." />

    <link rel="canonical" href="https://kray-digital.pp.ua/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kray-digital.pp.ua/" />
    <meta property="og:title" content="Kray Digital — Розробка сайтів та digital-маркетинг" />
    <meta property="og:description" content="Розробка швидких сайтів, SEO та Google реклама. 10% передоплати, 90% за фактом здачі робіт." />

    <!-- Non-blocking Google Fonts: Inter and Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" />
    </noscript>

    <!-- Google Analytics 4 (GA4: G-DXN3LJEFFF) & Google Tag Manager -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DXN3LJEFFF');

      function loadAnalytics() {
        if (window._analyticsLoaded) return;
        window._analyticsLoaded = true;

        // 1. Google Analytics 4 (GA4)
        var ga = document.createElement('script');
        ga.async = true;
        ga.src = "https://www.googletagmanager.com/gtag/js?id=G-DXN3LJEFFF";
        document.head.appendChild(ga);

        // 2. Google Tag Manager (GTM)
        var gtm = document.createElement('script');
        gtm.async = true;
        gtm.src = "https://www.googletagmanager.com/gtm.js?id=GTM-5TLVJ2GK";
        document.head.appendChild(gtm);
      }

      ['scroll', 'mousemove', 'touchstart', 'click', 'keydown'].forEach(function(e) {
        window.addEventListener(e, loadAnalytics, { once: true, passive: true });
      });
      setTimeout(loadAnalytics, 5000);
    </script>
  </head>
  <body class="bg-[#0f131e] text-[#dfe2f2]">

    <script type="module" src="/src/main.tsx"></script>
